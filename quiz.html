<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#13100d" />
  <title>Test — English Prep</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-sans-3-400.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-serif-4-400.woff2" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- A focused mode: no header, no nav. Answering a question must never
       move the control the learner is about to tap, so the action bar is
       part of the shell rather than part of the scrolling content. -->
  <main class="shell__scroll" id="shell-scroll">
    <div class="page stack stack--loose" id="quiz-container">
      <p class="t-meta">Sorular yükleniyor&hellip;</p>
    </div>
  </main>

  <div class="shell__bar" id="quiz-bar" hidden>
    <div class="shell__bar-inner"></div>
  </div>

  <p class="visually-hidden" id="live-region" role="status"></p>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
