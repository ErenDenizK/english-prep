<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Üniversite İngilizce hazırlık yeterlik sınavı için ücretsiz eğitim ve test uygulaması." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#13100d" />
  <title>Test — English Prep</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <!-- iOS ignores the manifest's icons for Add to Home Screen and wants
       this one. Without it the home-screen icon is a screenshot of the
       page, which is what it was. -->
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- This app is distributed by pasting a URL into a group chat, so the
       preview card is the first thing every one of its users will ever see
       of it. It was blank. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="English Prep" />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:title" content="English Prep — Test" />
  <meta property="og:description" content="Üniversite İngilizce hazırlık yeterlik sınavı için ücretsiz eğitim ve test uygulaması." />
  <meta property="og:url" content="https://erendenizk.github.io/english-prep/" />
  <meta property="og:image" content="https://erendenizk.github.io/english-prep/icons/social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="English Prep — üniversite İngilizce yeterlik sınavı için ders ve test." />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-sans-3-400.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-serif-4-400.woff2" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- A focused mode: no header, no nav. Answering a question must never
       move the control the learner is about to tap, so the action bar is
       part of the shell rather than part of the scrolling content. -->
  <main class="shell__scroll" id="shell-scroll">
    <div class="page stack stack--loose" id="quiz-container">
      <p class="t-meta">Sorular yükleniyor&hellip;</p>
    </div>
  </main>

  <div class="shell__bar" id="quiz-bar" hidden>
    <div class="shell__bar-inner"></div>
  </div>

  <p class="visually-hidden" id="live-region" role="status"></p>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
