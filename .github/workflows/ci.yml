name: CI

# Runs on both branches in the project's branch model (see README): every
# push to `test` where content and changes land first, and every push to
# `main`, plus pull requests targeting either.
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

# Read the code, nothing else: no job writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes an older run's verdict moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate content and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No `npm ci` step on purpose: the project has zero dependencies, so
      # there is no lockfile to install from and nothing to build.

      # Content is written by several different sessions, and any of them
      # that round-trips a topic file through JSON.stringify reformats
      # every question in it — a four-line change arriving as four hundred.
      - name: Check content formatting
        run: npm run format:check

      - name: Validate content
        run: npm run validate

      # Re-measures every colour token against its contrast requirement in
      # both WCAG 2 and APCA. The first draft of the palette passed WCAG
      # everywhere and failed APCA everywhere; nobody would have caught
      # that by looking.
      - name: Verify the palette
        run: npm run color

      - name: Run unit tests
        run: npm test

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Playwright stays out of package.json (zero dependencies): Python
      # Playwright for tests/*.py, a global Node Playwright of the same
      # minor for tools/verify-ui.mjs. Both drive the same Chromium build,
      # so one browser download serves both. Bump them together
      # (tests/README.md, "Bumping Playwright").
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm i -g playwright@1.56.1
          echo "PLAYWRIGHT_PATH=$(npm root -g)/playwright" >> "$GITHUB_ENV"

      - name: Start the static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && exit 0; sleep 0.2; done
          cat /tmp/serve.log; exit 1

      - name: Browser sweep (npm run verify)
        run: npm run verify -- http://127.0.0.1:8000

      # The runner starts its own server on a free port.
      - name: Python browser suites (npm run browser)
        if: success() || failure()
        run: npm run browser
