<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Eğitim — English Prep</title>
  <meta name="description" content="Üniversite İngilizce hazırlık yeterlik sınavı için ücretsiz eğitim ve test uygulaması." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#13100d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-sans-3-400.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/source-serif-4-400.woff2" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- The shell is a fixed-height column: header, one scrolling region, and
       either the bottom nav or a focused mode's action bar. Nothing else
       ever scrolls, so the frame cannot grow and cannot shift sideways. -->
  <header class="shell__header" id="shell-header">
    <div class="shell__header-inner">
      <h1 class="shell__brand t-en">English Prep</h1>
      <!-- Profil is identity and settings, not a content mode, so it opens
           from here rather than taking a third slot in the bottom nav. -->
      <button class="btn btn--secondary btn--icon" type="button" id="profile-trigger" aria-label="Profilini aç">
        <span id="profile-trigger-face" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="shell__scroll" id="shell-scroll">
    <div class="page stack stack--loose">
      <div class="note bleed" id="dev-note" hidden>
        <p>
          <strong>Geliştirme aşamasındayız</strong> — henüz v1 değil. Eğitim
          ve Test kullanıma hazır; yeni konular ekleniyor.
        </p>
        <button class="btn btn--quiet btn--icon" type="button" id="dev-note-dismiss" aria-label="Notu kapat"></button>
      </div>

      <section id="view-egitim" class="view stack stack--loose" aria-label="Eğitim" tabindex="-1" hidden>
        <div id="lesson-index" class="stack stack--loose">
          <p class="t-meta">Dersler yükleniyor&hellip;</p>
        </div>
        <div id="lesson-reader" hidden></div>
      </section>

      <section id="view-test" class="view stack stack--loose" aria-label="Test" tabindex="-1" hidden>
        <div id="test-panel" class="stack stack--loose">
          <p class="t-meta">Konular yükleniyor&hellip;</p>
        </div>
      </section>

      <section id="view-profil" class="view stack stack--loose" aria-label="Profil" tabindex="-1" hidden>
        <div id="profile-container" class="stack stack--loose">
          <p class="t-meta">Profil yükleniyor&hellip;</p>
        </div>
      </section>
    </div>
  </main>

  <!-- A nav landmark with aria-current, not a tablist: a tablist makes the
       whole bar one tab stop, implies panels in this document, and fights a
       hash router. -->
  <nav class="nav" id="bottom-nav" aria-label="Bölümler">
    <a class="nav__item" href="#egitim" data-view="egitim"><span data-icon></span><span>Eğitim</span></a>
    <a class="nav__item" href="#test" data-view="test"><span data-icon></span><span>Test</span></a>
  </nav>

  <!-- Shown only by the lesson reader, which runs as a focused mode with
       the header and the nav stepped out of the way. -->
  <div class="shell__bar" id="lesson-bar" hidden>
    <div class="shell__bar-inner"></div>
  </div>

  <!-- One persistent live region for the whole app. Its text is replaced;
       it is never created together with its content, because a region that
       appears already populated is frequently missed. -->
  <p class="visually-hidden" id="live-region" role="status"></p>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title">
    <div class="stack stack--tight">
      <h2 class="t-title" id="confirm-dialog-title">Geçmişi sıfırla</h2>
      <p class="t-body">
        Tüm test geçmişin ve ders ilerlemen bu cihazdan silinecek. Bu işlem
        geri alınamaz.
      </p>
    </div>
    <!-- Equal weight, deliberately. Filling one of them would either dress
         up a destructive action or make an amber Cancel the loudest thing
         on screen, and a confirmation is the one place where making the
         reader actually read is the point. The safe action takes focus. -->
    <div class="dialog__actions">
      <button class="btn btn--secondary" type="button" id="confirm-dialog-cancel">Vazgeç</button>
      <button class="btn btn--secondary" type="button" id="confirm-dialog-confirm">Sil</button>
    </div>
  </dialog>

  <script type="module" src="js/home.js"></script>
</body>
</html>
