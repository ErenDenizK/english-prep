<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<title>specimen — record strip v2 (light)</title>
<style>
  :root{
    --page:#f6f1e7; --card:#eee8dd; --raised:#e5dfd3;
    --ink-1:#211b14; --ink-2:#413a31; --ink-3:#685f54;
    --accent:#a05801; --accent-2:#b44200;
    --line: rgba(50,30,5,.10);
    --navbg:#f6f1e7;
    /* fixed record-mark ramp — same five hexes in both themes,
       not derived from either surface ladder (see 08-iki-tema-asimetrisi.md) */
    --m0: transparent; --m0-edge: rgba(50,30,5,.26);
    --m1:#6f6156; --m2:#8a7358; --m3:#b98f47; --m4:#f1af5d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--page);}
  body{
    width:390px; height:844px; overflow:hidden; position:relative;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink-1);
  }
  .bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 4px;
  }
  .bar h1{ font-family: Georgia, "Times New Roman", serif; font-weight:600; font-size:26px; margin:0; }
  .avatar{ width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink-3); }
  .body{ padding: 8px 20px 0; }

  .strip{ margin: 10px 0 20px; }
  .strip .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .strip .head span.t{ font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
  .strip .head span.n{ font-size:13px; color:var(--ink-3); }
  .grid{ display:grid; grid-template-columns: repeat(10, 1fr); gap:5px; }
  .grid .row-label{ grid-column: 1 / -1; display:none; }
  .cell{ aspect-ratio:1; border-radius:4px; }
  .cell.m0{ background:var(--m0); border:1.5px solid var(--m0-edge); }
  .cell.m1{ background:var(--m1); }
  .cell.m2{ background:var(--m2); }
  .cell.m3{ background:var(--m3); }
  .cell.m4{ background:var(--m4); }
  .cats{ margin-top:8px; margin-bottom:22px; font-size:11px; color:var(--ink-3); display:flex; gap:14px; }
  .cats b{ color:var(--ink-2); font-weight:600; }

  .eyebrow{
    font-size:13px; font-weight:600; letter-spacing:.08em;
    color:var(--accent); text-transform:uppercase; margin:0 0 8px;
  }
  h2{
    font-family: Georgia, "Times New Roman", serif;
    font-weight:600; font-size:24px; line-height:1.18; margin:0 0 10px;
  }
  p.lead{ font-size:14px; line-height:1.5; color:var(--ink-2); margin:0 0 8px; }
  .meta{ font-size:13px; color:var(--ink-3); margin:0 0 18px; }

  .session{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12px; font-weight:600; letter-spacing:.05em; color:var(--ink-3);
    text-transform:uppercase; padding-bottom:10px; border-bottom:1px solid var(--line);
    margin-bottom:2px;
  }
  .item{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .item .n{ font-size:15px; color:var(--ink-3); width:24px; }
  .item .t{ font-size:16px; font-weight:600; }
  .item .s{ font-size:13px; color:var(--ink-3); }
  .item .p{ font-size:16px; font-weight:700; color:var(--ink-1); }

  .footbar{
    position:absolute; left:0; right:0; bottom:0;
    padding:12px 20px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--navbg);
  }
  .btn{
    display:flex; align-items:center; justify-content:center;
    height:50px; border-radius:25px;
    background:var(--ink-1); color:var(--page);
    font-size:16px; font-weight:600;
  }
</style>
</head>
<body>
  <div class="bar">
    <h1 lang="tr">Bugün</h1>
    <div class="avatar"></div>
  </div>
  <div class="body">

    <div class="strip">
      <div class="head">

      </div>
      <div class="grid">
        <div class="cell m2"></div>
        <div class="cell m3"></div>
        <div class="cell m4"></div>
        <div class="cell m2"></div>
        <div class="cell m2"></div>

        <div class="cell m3"></div>
        <div class="cell m1"></div>
        <div class="cell m0"></div>
        <div class="cell m2"></div>
        <div class="cell m2"></div>
        <div class="cell m1"></div>
        <div class="cell m0"></div>
        <div class="cell m3"></div>
        <div class="cell m4"></div>
        <div class="cell m3"></div>
        <div class="cell m0"></div>
        <div class="cell m3"></div>
        <div class="cell m2"></div>
        <div class="cell m2"></div>
        <div class="cell m3"></div>
        <div class="cell m4"></div>
        <div class="cell m3"></div>
        <div class="cell m3"></div>
        <div class="cell m1"></div>
        <div class="cell m3"></div>
        <div class="cell m0"></div>
        <div class="cell m3"></div>
        <div class="cell m0"></div>
        <div class="cell m0"></div>
        <div class="cell m0"></div>
        <div class="cell m1"></div>
        <div class="cell m1"></div>
        <div class="cell m3"></div>
        <div class="cell m0"></div>
        <div class="cell m4"></div>
        <div class="cell m2"></div>
        <div class="cell m2"></div>
        <div class="cell m2"></div>
        <div class="cell m3"></div>
        <div class="cell m1"></div>
        <div class="cell m3"></div>
        <div class="cell m1"></div>
        <div class="cell m3"></div>
        <div class="cell m2"></div>
        <div class="cell m3"></div>
        <div class="cell m0"></div>

        <div class="cell m0"></div>

      </div>
      </div>
      <div class="cats"><b>Cloze</b><b>Closest</b><b>Reading</b><b>Paragraph</b></div>
    </div>

    <div class="eyebrow" lang="tr">Bugünün çalışması</div>
    <h2 lang="tr">Perfect Aspects ve Past Simple</h2>
    <p class="lead" lang="tr">Dün iki soruda <b style="color:var(--ink-1)">been</b> ile <b style="color:var(--ink-1)">gone</b> karıştı.</p>
    <p class="meta" lang="tr">6 soru · yaklaşık 8 dakika</p>

    <div class="session">
      <span lang="tr">I. Oturum · 60 puan</span>
      <span>30 / 60</span>
    </div>
  </div>

  <div class="footbar">
    <div class="btn" lang="tr">Oturumu başlat</div>
  </div>
</body>
</html>
