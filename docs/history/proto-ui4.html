<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Prep — yön denemesi (docs/app-plan.md)</title>
<!-- A static prototype, phase 0 of docs/app-plan.md. Six screens of the
     rebuilt app in the proposed language: editorial, with the expression
     put into drawings and a very small motion set. Real content, real
     fonts, the measured palette. No app code has changed; this exists to
     be looked at before any is.  -->
<link rel="stylesheet" href="../css/fonts.css">
<style>
:root {
  color-scheme: dark;
  --page: #0c1117;
  --ink: #e9ecef;
  --ink-2: #d0d4da;
  --rule: #2f3339;
  --rule-2: #454a51;
  --accent: #f1af5d;
  --accent-text: #f5ce95;
  --on-accent: #1a0f03;
  --ok: #7ccd8e;
  --no: #e97871;
  --lift: #181d23;

  --f-serif: "Source Serif 4", "Source Serif 4 Fallback", Georgia, serif;
  --f-sans: "Source Sans 3", "Source Sans 3 Fallback", system-ui, sans-serif;
  --gutter: 20px;
}
[data-theme="light"] {
  color-scheme: light;
  --page: #f6f1e7;
  --ink: #211b14;
  --ink-2: #413a31;
  --rule: #ddd8ce;
  --rule-2: #bdb7ab;
  --accent: #a05801;
  --accent-text: #623200;
  --on-accent: #fffcf7;
  --ok: #1f8944;
  --no: #c0392f;
  --lift: #fffcf7;
}

* { box-sizing: border-box; }
p, h1, h2, h3, h4, ul, ol, figure { margin: 0; }
body {
  margin: 0; padding: 40px 24px 64px;
  background: #6c7178; font-family: var(--f-sans);
  display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap;
}
[data-theme="light"] body { background: #cfc7b8; }

/* ---------- the phone frame (prototype only) ---------- */
.phone { width: 390px; flex: none; }
.phone > figcaption {
  font: 600 13px/1.4 var(--f-sans); color: #fff; letter-spacing: .06em;
  text-transform: uppercase; margin: 0 0 8px 2px; opacity: .85;
}
[data-theme="light"] .phone > figcaption { color: #2b2620; }
.screen {
  width: 390px; height: 844px; overflow: hidden; position: relative;
  background: var(--page); color: var(--ink); border-radius: 22px;
  display: flex; flex-direction: column;
  font-size: 18px; line-height: 28px;
}

/* ---------- chrome ---------- */
.bar {
  flex: none; display: grid; align-items: center; gap: 8px;
  grid-template-columns: minmax(max-content,1fr) minmax(0,max-content) minmax(max-content,1fr);
  min-height: 52px; padding: 0 var(--gutter);
  border-bottom: 1px solid var(--rule); background: var(--page);
}
.bar__title { margin: 0; font: 600 16px/22px var(--f-sans); text-align: center; letter-spacing: -.01em; }
.bar__lead  { justify-self: start; }
.bar__trail { justify-self: end; font: 600 15px/20px var(--f-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar__lead button, .bar__trail button {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2);
  font: 600 15px/20px var(--f-sans); display: inline-flex; align-items: center; gap: 6px;
}
.progress { flex: none; height: 2px; background: var(--rule); }
.progress > i { display: block; height: 100%; background: var(--accent); }
.body { flex: 1 1 auto; overflow: hidden; padding: 0 var(--gutter); }
.foot {
  flex: none; padding: 12px var(--gutter) calc(12px + env(safe-area-inset-bottom,0px));
  border-top: 1px solid var(--rule); display: flex; gap: 10px; background: var(--page);
}
.tabs {
  flex: none; display: flex; border-top: 1px solid var(--rule); background: var(--page);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
.tabs a {
  flex: 1; text-align: center; padding: 9px 0 11px; text-decoration: none;
  font: 600 13px/16px var(--f-sans); color: var(--ink-2); letter-spacing: .01em;
  display: grid; justify-items: center; gap: 3px;
}
.tabs a[aria-current] { color: var(--accent-text); }
.tabs svg { width: 22px; height: 22px; }

/* ---------- type ---------- */
.lbl  { font: 600 13px/18px var(--f-sans); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); margin: 0; }
.h1   { font: 600 29px/34px var(--f-sans); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.h2   { font: 600 21px/27px var(--f-sans); letter-spacing: -.015em; margin: 0; }
.en   { font-family: var(--f-serif); font-weight: 400; }
.lead { font: 400 20px/29px var(--f-serif); margin: 0; }
.p    { margin: 0; font: 400 17px/27px var(--f-sans); color: var(--ink-2); }
.p--ink { color: var(--ink); }
.meta { font: 600 14px/19px var(--f-sans); color: var(--ink-2); margin: 0; font-variant-numeric: tabular-nums; }
.num  { font-variant-numeric: tabular-nums; }
strong { font-weight: 600; color: var(--ink); }

/* ---------- rhythm ---------- */
.stack   { display: grid; gap: 14px; }
.stack--s { gap: 7px; }
.stack--l { gap: 26px; }
.sect    { padding: 22px 0; border-top: 1px solid var(--rule); display: grid; gap: 12px; }
.sect:first-child { border-top: 0; }
.pad-t   { padding-top: 22px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border: 0; border-radius: 10px; cursor: pointer;
  font: 600 17px/1 var(--f-sans); font-family: var(--f-sans);
  background: var(--accent); color: var(--on-accent); width: 100%;
}
.btn--ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-2); }
.btn--text  { background: none; color: var(--accent-text); width: auto; min-height: 40px; padding: 0; justify-content: flex-start; }
.foot .btn { flex: 1; }

/* ---------- rows ---------- */
.rows { display: grid; }
.row {
  display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 12px 0;
  border-top: 1px solid var(--rule); text-decoration: none; color: inherit;
}
.row:first-child { border-top: 0; }
.row__n { flex: none; width: 18px; font: 600 14px/20px var(--f-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row__m { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
.row__t { font: 400 17px/23px var(--f-sans); }
.row__s { font: 400 14px/19px var(--f-sans); color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.row__v { flex: none; font: 600 14px/20px var(--f-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.chev { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }

/* ---------- the week ---------- */
.week { display: flex; gap: 9px; align-items: center; }
.week i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--rule-2); display: block; }
.week i.on { background: var(--accent); box-shadow: none; }

/* ---------- figures ---------- */
.figs { display: flex; gap: 26px; }
.fig__v { font: 600 26px/30px var(--f-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.fig__l { font: 400 13px/18px var(--f-sans); color: var(--ink-2); }

/* ---------- the question ---------- */
.q { font: 400 21px/31px var(--f-serif); margin: 0; }
.blank { display: inline-block; width: 4.2ch; border-bottom: 2px solid var(--accent); }
.opts { display: grid; margin: 0 calc(-1 * var(--gutter)); }
.opt {
  display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left;
  min-height: 56px; padding: 14px var(--gutter); background: none; border: 0; cursor: pointer;
  border-top: 1px solid var(--rule); color: inherit;
  font: 400 18px/26px var(--f-serif); position: relative;
}
.opt__k { flex: none; font: 600 14px/26px var(--f-sans); color: var(--ink-2); width: 15px; }
/* the teacher's pen: the verdict is a mark in the margin, not a filled box */
.opt__mark { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; }
.opt--ok  { color: var(--ink); }
.opt--ok  .opt__k, .opt--no .opt__k { color: transparent; }
.opt--ok::before, .opt--no::before {
  content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 2px;
}
.opt--ok::before { background: var(--ok); }
.opt--no::before { background: var(--no); }
.opt--dim { color: var(--ink-2); }

/* ---------- the answer ---------- */
.verdict { display: flex; align-items: center; gap: 9px; font: 600 17px/24px var(--f-sans); }
.verdict--no { color: var(--no); }
.verdict--ok { color: var(--ok); }
.verdict span.rest { color: var(--ink); font-weight: 400; }
.expl { font: 400 17px/27px var(--f-sans); margin: 0; }
.note { font: 400 16px/25px var(--f-sans); color: var(--ink-2); margin: 0; }
.rule-line { font: 400 16px/25px var(--f-sans); margin: 0; padding-left: 13px; border-left: 2px solid var(--accent); }

/* ---------- the lesson fragment inside the session ---------- */
.frag { display: grid; gap: 18px; padding: 20px 0 4px; }
.side { display: grid; gap: 4px; }
.side__l { font: 400 19px/25px var(--f-serif); }
.side__g { font: 400 16px/25px var(--f-sans); color: var(--ink-2); }
.side__e { font: 400 17px/25px var(--f-serif); color: var(--ink); }
.dec { display: grid; gap: 16px; }
.dec__r { display: grid; gap: 2px; }
.dec__c { font: 400 16px/24px var(--f-sans); color: var(--ink-2); }
.dec__t { font: 400 17px/24px var(--f-serif); color: var(--ink); }
.dec__t::before { content: "→ "; color: var(--accent); }
.sig { font-family: var(--f-serif); color: var(--ink); }

/* ---------- drawings ---------- */
.mark  { width: 40px; height: 40px; flex: none; color: var(--ink); align-self: flex-start; margin-top: 4px; }
.scene { width: 118px; height: 118px; display: block; margin: 0 auto; color: var(--ink); }
</style>
</head>
<body>
